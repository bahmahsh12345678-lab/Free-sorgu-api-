<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logsuzlar API | 2026®</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Rajdhani',sans-serif;background:#04050d;color:#cdd9f0;min-height:100vh;overflow-x:hidden}
#snow-canvas{position:fixed;inset:0;pointer-events:none;z-index:0}
.top-neon{position:fixed;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#ff0055,#ff0088,#ff0055);background-size:300% 100%;animation:redNeon 2s linear infinite;box-shadow:0 0 20px #ff0055;z-index:9999;pointer-events:none}
@keyframes redNeon{0%{background-position:0% 50%}100%{background-position:300% 50%}}
.bottom-neon{position:fixed;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#00f5ff,#5865F2,#00f5ff);background-size:300% 100%;animation:blueNeon 2s linear infinite;box-shadow:0 0 20px #00f5ff;z-index:9999;pointer-events:none}
@keyframes blueNeon{0%{background-position:0% 50%}100%{background-position:300% 50%}}
.bg-mesh{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse 80% 60% at 20% 10%,rgba(88,101,242,.12),transparent 60%),radial-gradient(ellipse 60% 50% at 80% 90%,rgba(0,245,255,.09),transparent 55%),radial-gradient(ellipse 50% 40% at 90% 20%,rgba(255,0,170,.07),transparent 55%);pointer-events:none}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#00f5ff,#ff0055);border-radius:3px}
.page-wrap{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:50px 20px 80px}
.header{text-align:center;margin-bottom:40px;animation:fadeDown .9s cubic-bezier(.16,1,.3,1) both}
@keyframes fadeDown{from{opacity:0;transform:translateY(-30px)}to{opacity:1;transform:translateY(0)}}
.logo-ring{display:inline-flex;align-items:center;justify-content:center;width:100px;height:100px;border-radius:50%;border:2px solid #00f5ff;box-shadow:0 0 30px rgba(0,245,255,.35);margin-bottom:24px;position:relative;animation:spinRing 8s linear infinite}
.logo-ring::before{content:'';position:absolute;inset:-8px;border-radius:50%;border:1px dashed rgba(0,245,255,.25);animation:spinRing 4s linear infinite reverse}
@keyframes spinRing{to{transform:rotate(360deg)}}
.logo-ring i{font-size:2.2rem;background:linear-gradient(135deg,#00f5ff,#5865F2,#ff00aa);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.brand{font-family:'Orbitron',sans-serif;font-size:clamp(2rem,5vw,3.2rem);font-weight:900;letter-spacing:.12em;background:linear-gradient(135deg,#00f5ff,#5865F2,#ff00aa);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;line-height:1}
.subtitle{font-size:1rem;letter-spacing:.22em;text-transform:uppercase;color:rgba(180,195,240,.55);margin-top:10px}
.version-badge{display:inline-block;margin-top:14px;padding:4px 18px;border:1px solid #ffd700;border-radius:20px;font-size:.75rem;letter-spacing:.15em;color:#ffd700;text-transform:uppercase;box-shadow:0 0 12px rgba(255,215,0,.2)}
.status-bar{display:flex;justify-content:center;gap:20px;margin-top:16px;flex-wrap:wrap}
.status-item{display:flex;align-items:center;gap:6px;font-size:.75rem;color:rgba(180,195,240,.7)}
.status-item .dot{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 10px #22c55e;animation:pulseDot 2s infinite}
@keyframes pulseDot{0%{box-shadow:0 0 0 0 rgba(34,197,94,.7)}70%{box-shadow:0 0 0 8px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
.info-banner{background:linear-gradient(135deg,rgba(88,101,242,.12),rgba(0,245,255,.07));border:1px solid rgba(0,245,255,.25);border-radius:16px;padding:18px 28px;text-align:center;margin-bottom:30px;font-size:.9rem;color:rgba(180,200,255,.75);line-height:1.7;animation:fadeUp .8s .2s both}
.info-banner strong{color:#00f5ff}
@keyframes fadeUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.api-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;margin-bottom:30px}
.api-card{background:linear-gradient(145deg,#0d0d0d,#080d1a);border:1px solid rgba(88,101,242,.35);border-radius:16px;padding:20px;position:relative;overflow:hidden;transition:all .5s cubic-bezier(.22,1,.36,1);animation:cardIn .7s cubic-bezier(.16,1,.3,1) both;cursor:pointer}
@keyframes cardIn{from{opacity:0;transform:translateY(40px) scale(.92)}to{opacity:1;transform:translateY(0) scale(1)}}
.api-card::before{content:"";position:absolute;top:0;left:-100%;width:100%;height:2px;background:linear-gradient(90deg,transparent,#00f5ff,#5865F2,transparent);animation:panelScan 4s linear infinite}
@keyframes panelScan{0%{left:-100%}100%{left:100%}}
.api-card:hover{transform:translateY(-8px);border-color:#00f5ff;box-shadow:0 0 40px rgba(0,245,255,.25),0 12px 40px rgba(0,0,0,.6)}
.card-icon{width:52px;height:52px;display:flex;align-items:center;justify-content:center;border-radius:12px;font-size:1.4rem;margin-bottom:14px;border:1px solid #1a1a1a;background:linear-gradient(145deg,#181818,#0a0a0a);transition:all .4s}
.api-card:hover .card-icon{transform:rotate(-8deg) scale(1.15);border-color:#00f5ff;box-shadow:0 0 25px rgba(0,245,255,.5)}
.api-card h3{font-family:'Orbitron',sans-serif;font-size:.95rem;font-weight:700;color:#fff;margin-bottom:6px}
.api-card .desc{font-size:.75rem;color:rgba(180,195,240,.55);margin-bottom:14px;line-height:1.5}
.api-card .endpoints{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.api-card .ep{background:rgba(0,0,0,.4);border:1px solid rgba(88,101,242,.2);border-radius:8px;padding:8px 12px;font-family:monospace;font-size:.65rem;color:#ffcc00;word-break:break-all;transition:all .3s;display:flex;align-items:center;gap:8px}
.api-card .ep:hover{border-color:#00f5ff;background:rgba(0,245,255,.05)}
.api-card .ep i{color:#00f5ff;flex-shrink:0;font-size:.7rem}
.api-card .ep .method{font-size:.55rem;font-weight:700;padding:2px 6px;border-radius:4px;background:rgba(88,101,242,.2);color:#00f5ff;flex-shrink:0}
.api-card .ep .path{flex:1;color:#cdd9f0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn-try{padding:10px 16px;background:linear-gradient(135deg,rgba(88,101,242,.9),rgba(0,200,255,.8));border:none;border-radius:10px;color:#fff;font-family:'Orbitron',sans-serif;font-size:.7rem;font-weight:700;letter-spacing:.1em;cursor:pointer;transition:all .3s;width:100%}
.btn-try:hover{transform:translateY(-2px);box-shadow:0 0 30px rgba(88,101,242,.6)}
.modal-overlay{position:fixed;inset:0;background:rgba(4,5,13,.9);backdrop-filter:blur(10px);z-index:1000;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s;padding:20px}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal-box{background:linear-gradient(145deg,#0d0d0d,#080d1a);border:1px solid #00f5ff;border-radius:20px;padding:28px 32px;max-width:640px;width:100%;max-height:80vh;overflow-y:auto;box-shadow:0 0 60px rgba(0,245,255,.2);transform:scale(.92);transition:transform .35s}
.modal-overlay.open .modal-box{transform:scale(1)}
.modal-title{font-family:'Orbitron',sans-serif;font-size:1rem;letter-spacing:.15em;color:#00f5ff;margin-bottom:18px;display:flex;align-items:center;gap:10px}
.modal-body .ep-line{background:rgba(0,0,0,.4);border:1px solid rgba(88,101,242,.2);border-radius:8px;padding:10px 14px;font-family:monospace;font-size:.72rem;color:#00f5ff;margin:8px 0;word-break:break-all;display:flex;justify-content:space-between;align-items:center;gap:10px}
.modal-body .ep-line button{background:transparent;border:1px solid #00f5ff;color:#00f5ff;padding:4px 10px;border-radius:6px;font-size:.65rem;cursor:pointer;flex-shrink:0}
.modal-body .ep-line button:hover{background:rgba(0,245,255,.1)}
.modal-close{margin-top:22px;padding:10px 28px;background:transparent;border:1px solid rgba(0,245,255,.3);border-radius:10px;color:#00f5ff;font-family:'Rajdhani',sans-serif;font-size:.85rem;font-weight:600;cursor:pointer;letter-spacing:.1em}
.modal-close:hover{background:rgba(0,245,255,.1)}
.footer{text-align:center;margin-top:50px;font-size:.75rem;letter-spacing:.12em;color:rgba(100,120,180,.4);text-transform:uppercase}
.footer a{color:#00f5ff;text-decoration:none}
#toast-container{position:fixed;bottom:30px;right:30px;z-index:2000;display:flex;flex-direction:column;gap:10px}
.toast{padding:14px 22px;border-radius:12px;font-size:.85rem;font-weight:600;border-left:3px solid;backdrop-filter:blur(12px);animation:toastIn .4s;max-width:340px}
.toast.success{background:rgba(0,255,136,.1);border-color:#00ff88;color:#00ff88}
.toast.error{background:rgba(255,51,85,.1);border-color:#ff3355;color:#ff3355}
.toast.info{background:rgba(0,245,255,.08);border-color:#00f5ff;color:#00f5ff}
@keyframes toastIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
.loading{grid-column:1/-1;text-align:center;padding:60px 20px}
.spinner{width:50px;height:50px;border:3px solid rgba(88,101,242,.2);border-top-color:#00f5ff;border-radius:50%;margin:0 auto 20px;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{color:rgba(150,175,220,.6);font-size:.95rem}
@media (max-width:768px){.api-grid{grid-template-columns:1fr}.brand{font-size:2rem}}
</style>
</head>
<body>
<canvas id="snow-canvas"></canvas>
<div class="bg-mesh"></div>
<div class="top-neon"></div>
<div class="bottom-neon"></div>
<div id="toast-container"></div>

<div class="modal-overlay" id="endpointModal">
  <div class="modal-box">
    <div class="modal-title"><i class="fas fa-terminal"></i> <span id="modalTitle">API</span></div>
    <div class="modal-body" id="modalBody"></div>
    <button class="modal-close" onclick="closeModal()">KAPAT</button>
  </div>
</div>

<div class="page-wrap">
  <div class="header">
    <div class="logo-ring"><i class="fas fa-bolt"></i></div>
    <div class="brand">LOGSUZLAR API</div>
    <div class="subtitle">2026® · Professional API</div>
    <div class="version-badge">💎 <span id="versionText">Yükleniyor...</span></div>
    <div class="status-bar">
      <div class="status-item"><span class="dot"></span> Sistem Aktif</div>
      <div class="status-item"><i class="fas fa-server" style="color:#00f5ff"></i> <span id="apiUrl">Yükleniyor...</span></div>
      <div class="status-item"><i class="fas fa-bolt" style="color:#ffd700"></i> <span id="apiCount">6</span> API Modülü</div>
    </div>
  </div>

  <div class="info-banner" id="infoBanner">
    <strong>Yükleniyor...</strong>
  </div>

  <div class="api-grid" id="apiGrid">
    <div class="loading">
      <div class="spinner"></div>
      <div class="loading-text">API'ler yükleniyor...</div>
    </div>
  </div>

  <div class="footer">
    <div>© 2026 <strong>Logsuzlar API</strong> · Sahip: <a href="https://t.me/fbxnext" target="_blank">@fbxnext</a> · Kanal: <a href="https://t.me/logsuzlarvip" target="_blank">@logsuzlarvip</a></div>
  </div>
</div>

<script>
(function(){
  const canvas = document.getElementById('snow-canvas');
  const ctx = canvas.getContext('2d');
  let W, H, flakes = [];
  function resize(){W = canvas.width = window.innerWidth;H = canvas.height = window.innerHeight;}
  resize();
  window.addEventListener('resize', resize);
  for (let i = 0; i < 120; i++) {
    flakes.push({x:Math.random()*1920,y:Math.random()*1080,r:Math.random()*2+0.4,speed:Math.random()*0.6+0.15,drift:(Math.random()-0.5)*0.4,opacity:Math.random()*0.5+0.1,twinkle:Math.random()*Math.PI*2});
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    flakes.forEach(f => {
      f.twinkle += 0.012;
      const alpha = f.opacity + Math.sin(f.twinkle) * 0.08;
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r, 0, Math.PI*2);
      ctx.fillStyle = `rgba(200,220,255,${Math.max(0, alpha)})`;
      ctx.fill();
      f.y += f.speed; f.x += f.drift;
      if (f.y > H+5){f.y=-5;f.x=Math.random()*W;}
      if (f.x > W+5) f.x = -5;
      if (f.x < -5) f.x = W+5;
    });
    requestAnimationFrame(draw);
  }
  draw();
})();

function toast(msg, type='info', duration=3000){
  const c = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  c.appendChild(el);
  setTimeout(() => el.remove(), duration);
}

const BASE_URL = window.location.origin;
let API_DATA = [];

async function apiListesiCek(){
  try {
    const r = await fetch(BASE_URL + "/");
    const d = await r.json();
    API_DATA = d.apis || [];
    document.getElementById('versionText').textContent = d.versiyon || 'v6.0';
    document.getElementById('apiCount').textContent = d.toplam_api || API_DATA.length;
    document.getElementById('apiUrl').textContent = BASE_URL.replace('https://','').replace('http://','');
    document.getElementById('infoBanner').innerHTML = `<strong>${API_DATA.length} API</strong> tek platformda · ` + API_DATA.map(a => `<strong>${a.name}</strong>`).join(' + ') + `<br>Kullanmak istediğin API'yi seç, endpoint'leri gör, tarayıcıda test et.`;
    renderApiCards();
  } catch(e) {
    document.getElementById('apiGrid').innerHTML = `<div class="loading"><div class="loading-text" style="color:#ff3355">❌ API listesi alınamadı: ${e.message}</div></div>`;
  }
}

function renderApiCards(){
  const grid = document.getElementById('apiGrid');
  if (API_DATA.length === 0) {
    grid.innerHTML = '<div class="loading"><div class="loading-text">API bulunamadı</div></div>';
    return;
  }
  let html = '';
  API_DATA.forEach((api, idx) => {
    const endpointsHtml = api.endpoints.map(ep => `<div class="ep"><span class="method">${ep.method}</span><i class="fas fa-link"></i><span class="path">${ep.path}</span></div>`).join('');
    html += `
      <div class="api-card" style="animation-delay:${idx*0.1}s" onclick="showModal('${api.key}')">
        <div class="card-icon" style="color:${api.color}"><i class="fas ${api.icon}"></i></div>
        <h3>${api.name}</h3>
        <div class="desc">${api.desc}</div>
        <div class="endpoints">${endpointsHtml}</div>
        <button class="btn-try" onclick="event.stopPropagation();showModal('${api.key}')">🔗 ENDPOINT'LERİ GÖR</button>
      </div>`;
  });
  grid.innerHTML = html;
}

function showModal(key){
  const api = API_DATA.find(a => a.key === key);
  if (!api) return;
  document.getElementById('modalTitle').textContent = api.name + " · Endpoint'ler";
  let html = `<p style="margin-bottom:14px;color:rgba(180,200,240,.7)">${api.desc}</p>`;
  api.endpoints.forEach(ep => {
    const fullUrl = BASE_URL + ep.path;
    html += `
      <div style="margin-bottom:14px">
        <div style="font-size:.7rem;color:#00f5ff;margin-bottom:4px;text-transform:uppercase;letter-spacing:.1em">${ep.label} · ${ep.desc}</div>
        <div class="ep-line"><span><span style="color:#22c55e">${ep.method}</span> ${fullUrl}</span><button onclick="kopyala('${fullUrl}')">KOPYALA</button></div>
        <a href="${fullUrl}" target="_blank" style="display:inline-block;margin-top:6px;font-size:.7rem;color:#ffcc00;text-decoration:none">↗ Tarayıcıda Aç</a>
      </div>`;
  });
  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('endpointModal').classList.add('open');
}

function closeModal(){document.getElementById('endpointModal').classList.remove('open');}

document.getElementById('endpointModal').addEventListener('click', function(e){if (e.target === this) closeModal();});

function kopyala(text){
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(() => toast('✅ Kopyalandı!', 'success'));
  } else {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.left = '-9999px';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    toast('✅ Kopyalandı!', 'success');
  }
}

apiListesiCek();
</script>
</body>
</html>
